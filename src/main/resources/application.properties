# Server Configuration
server.port=8090
server.servlet.context-path=/ms-application-registration

# Application Configuration
spring.application.name=ms-application-registration

# Database Configuration
# Set MYSQL_PASSWORD in non-local environments to avoid the development default.
spring.datasource.url=jdbc:mysql://localhost:3306/SAHYOG_DB?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:password}

# JPA Configuration
# Keep the schema and registered applications between application restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=WARN
logging.level.com.sahyog.msappreg=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
